services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fleetdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - fleetdesk-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  fleetdesk-api:
    build:
      context: .
      dockerfile: src/FleetDesk.Api/Dockerfile
    container_name: fleetdesk-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FleetDesk;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      Jwt__Issuer: "FleetDesk.Api"
      Jwt__Audience: "FleetDesk.Clients"
      Jwt__SigningKey: "CHANGE_ME_DEV_ONLY_FleetDesk_Super_Secret_Key_2026"
      Jwt__ExpirationMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:8081"
    ports:
      - "8080:8080"

  fleetdesk-web:
    build:
      context: .
      dockerfile: src/FleetDesk.Web/Dockerfile
    container_name: fleetdesk-web
    depends_on:
      - fleetdesk-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Api__BaseUrl: "http://fleetdesk-api:8080"
    ports:
      - "8081:8080"

volumes:
  fleetdesk-sqlserver-data:
